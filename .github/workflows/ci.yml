name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary & run Rust unit tests
        run: |
          cargo build --release --locked
          cargo test --release --locked
          ./target/release/jsonbit --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies & run TypeScript + Vitest checks
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Setup Python & verify Python SDK
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test Python SDK & MCP server
        run: |
          python3 -B -c '
          import json, subprocess
          from python.jsonbit import JsonBit
          with JsonBit("benchmarks/data/github-repos.json") as olap:
              assert olap.answer("How many repositories have more than 150000 stars and more than 30000 forks?") == "31"
              assert len(olap.sql("SELECT defaultBranch, COUNT(*) AS cnt FROM records GROUP BY defaultBranch")) > 0
          proc = subprocess.run(
              ["./target/release/jsonbit", "mcp"],
              input="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}\n",
              capture_output=True, text=True, check=True,
          )
          assert json.loads(proc.stdout.strip()) == {"jsonrpc": "2.0", "id": 1, "result": {}}
          print("Python SDK & MCP ping OK")
          '
