[package]
name = "jsonbit"
version = "1.1.6"
edition = "2021"
authors = ["Prathik Murugan"]
description = "jsonbit — Pure-Rust Auto-3NF Columnar Bit-Packed & BitVec64 Analytical Engine for LLMs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/prathikmurugan/jsonbit"
keywords = ["json", "olap", "llm", "mcp", "columnar"]
categories = ["command-line-utilities", "database-implementations", "encoding"]

[[bin]]
name = "jsonbit"
path = "rust/main.rs"

[lib]
name = "jsonbit"
path = "rust/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
