<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" width="880" height="494">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #1e293b; stroke-width: 1.25; }
      .bar { fill: #f8fafc; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
      .title { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #64748b; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1e293b; }
      .dim { font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #64748b; }
      .prompt { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #2563eb; }
      .cmd { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .cmdsm { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .hdr { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1d4ed8; }
      .json { font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .pill-slate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .pill-slate-txt { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1e293b; }
      .pill-ok { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .pill-ok-txt { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1d4ed8; }
      .step1 { opacity: 0; animation: show1 12s infinite; }
      .step2 { opacity: 0; animation: show2 12s infinite; }
      .step3 { opacity: 0; animation: show3 12s infinite; }
      .step4 { opacity: 0; animation: show4 12s infinite; }
      @keyframes show1 { 0%,4% { opacity: 0; } 6%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show2 { 0%,18% { opacity: 0; } 20%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show3 { 0%,46% { opacity: 0; } 48%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show4 { 0%,68% { opacity: 0; } 70%,96% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="4" y="4" width="872" height="486" rx="12" class="card"/>
  <path d="M4 16 Q4 4 16 4 H864 Q876 4 876 16 V42 H4 Z" class="bar"/>
  <line x1="4" y1="42" x2="876" y2="42" class="divider"/>
  <circle cx="24" cy="23" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="42" cy="23" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="60" cy="23" r="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <text x="440" y="27" text-anchor="middle" class="title">jsonbit  —  orders.json (150 nested orders, 86 KB)</text>

  <!-- Step 1: Baseline -->
  <g class="step1">
    <text x="26" y="70" class="dim"># Baseline context cost (feeding orders.json directly to an LLM)</text>
    <rect x="26" y="80" width="828" height="28" rx="6" class="pill-slate"/>
    <text x="38" y="99" class="pill-slate-txt">Raw JSON: 25,466 tokens   |   Minified JSON: 15,820 tokens</text>
  </g>

  <!-- Step 2: jsonbit card -->
  <g class="step2">
    <text x="26" y="138" class="prompt">$</text>
    <text x="44" y="138" class="cmd">jsonbit card orders.json</text>
    <text x="26" y="162" class="hdr"># jsonbit 3NF Bit-Packed Columnar Cube (Rust)</text>
    <text x="26" y="182" class="mono">TABLE orders (rows=150, pk=orderId, fields=[orderId,customer,status,items,orderTotal])</text>
    <text x="26" y="201" class="dim">  num_cube: items_count[sum=344,avg=2.29] orderTotal[sum=1047617.75,avg=6984.12]</text>
    <text x="26" y="220" class="dim">  cat_cube: status{cancelled:34,processing:30,shipped:30,refunded:29,delivered:27}</text>
    <text x="26" y="239" class="mono">TABLE orders_items (rows=344, CSR_JOIN-&gt;orders, fields=[sku,name,qty,unitPrice])</text>
    <rect x="26" y="250" width="828" height="28" rx="6" class="pill-ok"/>
    <text x="38" y="269" class="pill-ok-txt">✓ Schema card: 470 tokens (-98.2% vs. Raw)  |  Digest: 4,573 (-82.0%)  |  RAM: 4.5 KB</text>
  </g>

  <!-- Step 3: jsonbit sql -->
  <g class="step3">
    <text x="26" y="308" class="prompt">$</text>
    <text x="44" y="308" class="cmdsm">jsonbit sql orders.json "SELECT status, COUNT(*) AS cnt, SUM(orderTotal) AS rev FROM orders GROUP BY status"</text>
  </g>

  <!-- Step 4: Exact SQL Output -->
  <g class="step4">
    <text x="26" y="330" class="dim">[</text>
    <text x="26" y="348" class="json">  { "status": "cancelled",  "cnt": 34, "rev": 251414.75 },</text>
    <text x="26" y="366" class="json">  { "status": "shipped",    "cnt": 30, "rev": 220186.50 },</text>
    <text x="26" y="384" class="json">  { "status": "processing", "cnt": 30, "rev": 214137.50 },</text>
    <text x="26" y="402" class="json">  { "status": "refunded",   "cnt": 29, "rev": 155387.25 },</text>
    <text x="26" y="420" class="json">  { "status": "delivered",  "cnt": 27, "rev": 206491.75 }</text>
    <text x="26" y="438" class="dim">]</text>
    <rect x="26" y="446" width="828" height="28" rx="6" class="pill-ok"/>
    <text x="38" y="465" class="pill-ok-txt">✓ Exact Rust BitVec64 SQL result in 48 µs  |  100% deterministic, zero hallucinations</text>
  </g>
</svg>
