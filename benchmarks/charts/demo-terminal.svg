<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .title { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
      .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e6edf3; }
      .dim { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
      .prompt { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #58a6ff; }
      .cmd { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f0f6fc; }
      .green { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #3fb950; }
      .amber { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #d29922; }
      .red { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f85149; }
      .cyan { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #79c0ff; }
      .step1 { opacity: 0; animation: show1 12s infinite; }
      .step2 { opacity: 0; animation: show2 12s infinite; }
      .step3 { opacity: 0; animation: show3 12s infinite; }
      .step4 { opacity: 0; animation: show4 12s infinite; }
      @keyframes show1 { 0%,4% { opacity: 0; } 6%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show2 { 0%,18% { opacity: 0; } 20%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show3 { 0%,46% { opacity: 0; } 48%,96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes show4 { 0%,68% { opacity: 0; } 70%,96% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="880" height="470" rx="12" class="bg" stroke="#30363d" stroke-width="1.5"/>
  <path d="M0 12 Q0 0 12 0 H868 Q880 0 880 12 V38 H0 Z" class="bar"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="440" y="23" text-anchor="middle" class="title">jsonbit — 150 Nested Orders (86 KB, 25,466 Raw JSON Tokens)</text>

  <!-- Step 1: Before -->
  <g class="step1">
    <text x="24" y="68" class="dim"># Before: feeding orders.json directly into an LLM context window</text>
    <text x="24" y="90" class="red">Raw JSON: 25,466 tokens  |  Minified JSON: 15,820 tokens  |  TOON v4: 15,372 tokens</text>
  </g>

  <!-- Step 2: jsonbit card -->
  <g class="step2">
    <text x="24" y="126" class="prompt">$</text>
    <text x="40" y="126" class="cmd">jsonbit card orders.json</text>
    <text x="24" y="148" class="cyan"># jsonbit 3NF Bit-Packed Columnar Cube (Rust)</text>
    <text x="24" y="168" class="mono">TABLE orders (rows=150, pk=orderId, fields=[orderId,customer,status,items,orderTotal])</text>
    <text x="24" y="188" class="dim">  num_cube: items_count[sum=344,avg=2.29] orderTotal[sum=1047617.75,avg=6984.12]</text>
    <text x="24" y="208" class="dim">  cat_cube: status{cancelled:34,processing:30,shipped:30,refunded:29,delivered:27}</text>
    <text x="24" y="228" class="mono">TABLE orders_items (rows=344, CSR_JOIN-&gt;orders, fields=[sku,name,qty,unitPrice])</text>
    <text x="24" y="250" class="green">✓ Schema &amp; stats card: 470 tokens (-98.2% vs. Raw JSON)  |  RAM: 4.5 KB (-90.7%)</text>
  </g>

  <!-- Step 3: jsonbit sql -->
  <g class="step3">
    <text x="24" y="288" class="prompt">$</text>
    <text x="40" y="288" class="cmd">jsonbit sql orders.json "SELECT status, COUNT(*) AS cnt, SUM(orderTotal) AS rev FROM orders GROUP BY status"</text>
  </g>

  <!-- Step 4: Exact SQL Output -->
  <g class="step4">
    <text x="24" y="314" class="mono">[</text>
    <text x="40" y="334" class="amber">{ "status": "cancelled",  "cnt": 34, "rev": 251414.75 },</text>
    <text x="40" y="354" class="amber">{ "status": "shipped",    "cnt": 30, "rev": 220186.50 },</text>
    <text x="40" y="374" class="amber">{ "status": "processing", "cnt": 30, "rev": 214137.50 },</text>
    <text x="40" y="394" class="amber">{ "status": "refunded",   "cnt": 29, "rev": 155387.25 },</text>
    <text x="40" y="414" class="amber">{ "status": "delivered",  "cnt": 27, "rev": 206491.75 }</text>
    <text x="24" y="434" class="mono">]</text>
    <text x="24" y="456" class="green">✓ Exact Rust BitVec64 SQL result in 48 µs  |  0 arithmetic hallucinations</text>
  </g>
</svg>
